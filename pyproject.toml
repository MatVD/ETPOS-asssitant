[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etpos-assistant"
version = "0.1.0"
description = "Assistant documentaire local-first pour la documentation officielle ETPOS"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.140,<0.142",
  "uvicorn[standard]>=0.35,<0.50",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<0.1",
  "argon2-cffi>=25.1,<26",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.14,<5",
  "markdown-it-py>=4.0,<5",
  "faster-whisper>=1.2.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
etpos-assistant = "etpos_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etpos_assistant = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
